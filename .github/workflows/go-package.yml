name: Build and release weather package
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A version is assigned only after the previous release has published its tag.
concurrency:
  group: weather-release-main
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          bash scripts/test_release_version.sh
          bash scripts/next_release_version.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          tag="v$(sed -n 's/^version=//p' "$GITHUB_OUTPUT")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'published=true\n' >> "$GITHUB_OUTPUT"
            printf '%s is already published.\n' "$tag"
          else
            printf 'published=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Freeze source and build inside pinned container
        if: steps.version.outputs.published != 'true'
        shell: bash
        env:
          WEATHER_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/run_go_migration_build.sh
      - name: Retain build and assessment evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.version.outputs.published != 'true'
        with:
          name: weather-build-evidence-${{ github.run_id }}
          path: dist/go-migration.*/evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Check and name release assets
        if: steps.version.outputs.published != 'true'
        id: assets
        shell: bash
        env:
          WEATHER_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          outputs=(dist/go-migration.*)
          [[ ${#outputs[@]} -eq 1 && -d ${outputs[0]} ]]
          cd "${outputs[0]}"
          sha256sum --check SHA256SUMS
          jq -e --arg sha "$GITHUB_SHA" \
            '.source_commit == $sha and .source_dirty == false and .source_status == [] and .runtime == "go-qt" and .architecture == "x86_64"' \
            go-runtime.json
          tar -xOf a-weather-app-go-qt-linux-x86_64.tar ./manifest.json |
            jq -e --arg version "$WEATHER_RELEASE_VERSION" '.version == $version'
          archive="a-weather-app-v${WEATHER_RELEASE_VERSION}-linux-x86_64.tar"
          mv a-weather-app-go-qt-linux-x86_64.tar "$archive"
          sha256sum "$archive" > SHA256SUMS
          printf 'directory=%s\narchive=%s\n' "$PWD" "$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.version.outputs.published != 'true'
        with:
          name: a-weather-app-v${{ steps.version.outputs.version }}-linux-x86_64
          path: ${{ steps.assets.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: steps.version.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
          RELEASE_ARCHIVE: ${{ steps.assets.outputs.archive }}
        run: |
          set -euo pipefail
          cd "$RELEASE_DIRECTORY"
          notes_file="$GITHUB_WORKSPACE/packaging/releases/v${RELEASE_VERSION}.md"
          notes_args=(--notes "Linux x86_64 package for Omarchy. Verify the archive with SHA256SUMS before extracting.")
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "v${RELEASE_VERSION}" \
            "$RELEASE_ARCHIVE" SHA256SUMS go-runtime.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${RELEASE_VERSION}" --latest --generate-notes \
            "${notes_args[@]}"
      - name: Pin the published runtime for plugin installs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PUBLISHED: ${{ steps.version.outputs.published }}
          RELEASE_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          set -euo pipefail
          # A newer source commit will publish and pin its own release. Never
          # attach this release's digest to a different source revision.
          if [[ $(git ls-remote origin refs/heads/main | cut -f1) != "$GITHUB_SHA" ]]; then
            printf 'Main advanced; the newer build will pin its own release.\n'
            exit 0
          fi
          tag="v${RELEASE_VERSION}"
          archive="a-weather-app-${tag}-linux-x86_64.tar"
          if [[ "$RELEASE_PUBLISHED" == true ]]; then
            release_directory=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS --pattern go-runtime.json --dir "$release_directory"
          else
            release_directory="$RELEASE_DIRECTORY"
            (cd "$release_directory" && sha256sum --check SHA256SUMS)
          fi
          [[ $(wc -l < "$release_directory/SHA256SUMS") == 1 ]]
          read -r digest checksum_name < "$release_directory/SHA256SUMS"
          [[ "$digest" =~ ^[a-f0-9]{64}$ && "$checksum_name" == "$archive" ]]
          jq -e --arg source "$GITHUB_SHA" \
            '.source_commit == $source and .source_dirty == false and .source_status == []' \
            "$release_directory/go-runtime.json" >/dev/null
          jq -n --arg tag "$tag" --arg digest "$digest" --arg source "$GITHUB_SHA" \
            '{schemaVersion: 1, tag: $tag, archive_sha256: $digest, source_commit: $source}' \
            > packaging/release-lock.json
          jq --arg version "$RELEASE_VERSION" '.version = $version' manifest.json > manifest.json.next
          mv manifest.json.next manifest.json
          sed -i -E "s/^APP_VERSION \?= 0\.[0-9]+\.[0-9]+$/APP_VERSION ?= ${RELEASE_VERSION}/" Makefile
          sed -i -E "s/^var appVersion = \"0\.[0-9]+\.[0-9]+\"$/var appVersion = \"${RELEASE_VERSION}\"/" cmd/a-weather-app/main.go
          git add packaging/release-lock.json manifest.json Makefile cmd/a-weather-app/main.go
          if git diff --cached --quiet; then
            printf 'Release pin is already current.\n'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Pin plugin runtime to ${tag} [skip ci]"
          gh auth setup-git
          if ! git push origin HEAD:main; then
            if [[ $(git ls-remote origin refs/heads/main | cut -f1) != "$GITHUB_SHA" ]]; then
              printf 'Main advanced before the pin push; the newer build will pin its own release.\n'
              exit 0
            fi
            printf 'Release was published, but its pin could not be pushed.\n' >&2
            exit 1
          fi
